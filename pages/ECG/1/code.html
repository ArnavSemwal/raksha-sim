<style>
        body {
            background-color: #ffffff; /* Level 0 Pure White */
            color: #121212;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px; /* Mobile constraint for clinical device feel */
            padding: 24px; /* Safe zone margins */
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #ffffff;
            min-height: 100vh;
            border: 1px solid #e5e5e5; /* Optional constraint boundary for web viewing */
        }
    </style>

<body>
<div class="app-container">
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container-highest rounded-full mb-8 overflow-hidden">
<div class="h-full bg-primary-container" style="width: 33%;"></div>
</div>
<!-- Header: Raksha Logo -->
<div class="flex items-center justify-center mb-8">
<span class="material-symbols-outlined text-primary-container mr-2" style="font-variation-settings: 'FILL' 0;">shield</span>
<h1 class="font-headline-md text-headline-md text-primary-container tracking-wider uppercase">Raksha</h1>
</div>
<!-- Sub-header -->
<div class="flex justify-between items-end mb-8">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Step 2:<br/>ECG</h2>
<div class="bg-surface-container py-2 px-4 rounded-full">
<span class="font-label-xl text-label-xl text-on-surface-variant">ID: PT-XXXX</span>
</div>
</div>
<!-- Center Image (ECG Lead Placement) -->
<div class="w-full bg-surface-container-lowest rounded-2xl mb-8 flex items-center justify-center border-2 border-transparent">
<img alt="ECG Lead Placement" class="w-full max-w-[300px] h-auto object-contain mix-blend-multiply" src="https://lh3.googleusercontent.com/aida/AP1WRLsz2jmV0is6IjlcbqKFjJivuEIcFs-JeWiIyg-Zgu-bPXImK0iHjQBDiXpsvWpwpIuEPA4foWmvOdM6m8-1LPct0GLQpTf0d7vWMKaE9uSLFMuoPCSRt3v6iFg1JNERDBdzqxTxmgXBqJcCkKrG8424CYiOni1AXex3XEC1l4nhortfeLGR3oJ2CtcyB_zL4OpWvm3A_sxj8jXPI1NjZ4EoLIQq5gUbQXD0DTPzJy78FzxpZ4-shoz7OBc"/>
</div>
<!-- Instruction Text -->
<p class="font-body-lg text-body-lg text-center text-on-surface-variant mb-12">
        Place ECG leads securely on the chest as shown.
    </p>
<!-- Spacer to push bottom buttons down -->
<div class="flex-grow"></div>
<!-- Action Buttons -->
<div class="flex flex-col gap-4 w-full mt-auto pb-4">
<button class="w-full bg-primary-container text-on-primary py-[24px] rounded-lg font-action-lg text-action-lg flex justify-center items-center active:scale-[0.98] transition-transform">
            Start 10s ECG Scan
        </button>
<button class="w-full bg-primary-container text-on-primary py-[24px] rounded-lg font-action-lg text-action-lg flex justify-center items-center active:scale-[0.98] transition-transform">
            Proceed to Blood Pressure →
        </button>
</div>
</div>
</body></html>
