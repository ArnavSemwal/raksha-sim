<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Triage Summary &amp; Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#2563eb",
                    "on-tertiary": "#ffffff",
                    "on-primary-container": "#eeefff",
                    "on-background": "#1c1b1b",
                    "on-primary-fixed": "#00174b",
                    "surface-container-high": "#ebe7e7",
                    "surface-container-highest": "#e5e2e1",
                    "surface-bright": "#fcf9f8",
                    "inverse-primary": "#b4c5ff",
                    "on-secondary": "#ffffff",
                    "outline": "#737686",
                    "secondary-fixed-dim": "#b4c5ff",
                    "tertiary-fixed": "#ffdbcd",
                    "on-tertiary-fixed": "#360f00",
                    "on-surface-variant": "#434655",
                    "secondary": "#495c95",
                    "surface": "#fcf9f8",
                    "on-primary": "#ffffff",
                    "inverse-surface": "#313030",
                    "secondary-fixed": "#dbe1ff",
                    "tertiary-container": "#bc4800",
                    "on-secondary-fixed-variant": "#31447b",
                    "on-error": "#ffffff",
                    "primary-fixed-dim": "#b4c5ff",
                    "on-error-container": "#93000a",
                    "error": "#ba1a1a",
                    "inverse-on-surface": "#f3f0ef",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "outline-variant": "#c3c6d7",
                    "on-secondary-container": "#394c84",
                    "surface-container-lowest": "#ffffff",
                    "surface-variant": "#e5e2e1",
                    "on-surface": "#1c1b1b",
                    "surface-tint": "#0053db",
                    "on-secondary-fixed": "#00174b",
                    "on-primary-fixed-variant": "#003ea8",
                    "surface-container-low": "#f6f3f2",
                    "secondary-container": "#acbfff",
                    "error-container": "#ffdad6",
                    "surface-container": "#f0edec",
                    "primary-fixed": "#dbe1ff",
                    "tertiary-fixed-dim": "#ffb596",
                    "tertiary": "#943700",
                    "primary": "#004ac6",
                    "on-tertiary-container": "#ffede6",
                    "surface-dim": "#dcd9d9",
                    "background": "#fcf9f8"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "screen-margin": "24px",
                    "button-padding-h": "32px",
                    "button-padding-v": "24px",
                    "stack-gap": "16px",
                    "touch-target-min": "64px",
                    "section-gap": "40px"
            },
            "fontFamily": {
                    "display-lg": ["Inter"],
                    "action-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-xl": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "headline-lg": ["Inter"]
            },
            "fontSize": {
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "action-lg": ["22px", {"lineHeight": "28px", "fontWeight": "700"}],
                    "body-lg": ["20px", {"lineHeight": "30px", "fontWeight": "400"}],
                    "label-xl": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:max-w-md md:mx-auto border-x border-outline-variant relative">
<!-- Linear Progress Bar -->
<div class="w-full h-1 bg-surface-container-high absolute top-0 left-0 z-10 pt-4 px-6 md:px-0">
<div class="h-1 bg-primary w-full max-w-md mx-auto relative top-4 rounded-full"></div>
</div>
<!-- Header / Brand -->
<header class="pt-10 pb-4 px-screen-margin flex flex-col items-center justify-center border-b-2 border-outline-variant md:border-none relative">
<div class="flex items-center gap-2 text-primary font-headline-md tracking-tight">
<span class="material-symbols-outlined text-[28px]" data-icon="shield">shield</span>
<span>RAKSHA</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-screen-margin pb-screen-margin pt-6 gap-section-gap relative">
<!-- Title & ID -->
<div class="flex justify-between items-start w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background max-w-[60%]">
                Final Triage &amp;<br/>Summary
            </h1>
<div class="bg-surface-container-highest px-3 py-1 rounded-full font-label-xl text-label-xl text-on-surface-variant flex items-center justify-center border border-outline-variant">
                ID: PT-XXXX
            </div>
</div>
<!-- Center Container: Triage Data -->
<div class="bg-surface-container border-2 border-outline-variant rounded-xl p-6 flex flex-col gap-6 shadow-sm">
<!-- Vitals Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="bg-surface p-4 rounded-lg border border-outline-variant flex flex-col items-start gap-1">
<span class="font-body-md text-on-surface-variant text-sm uppercase tracking-wider">Heart Rate</span>
<span class="font-headline-md text-headline-md text-on-background">78.5 <span class="text-sm font-normal text-on-surface-variant">BPM</span></span>
</div>
<div class="bg-surface p-4 rounded-lg border border-outline-variant flex flex-col items-start gap-1">
<span class="font-body-md text-on-surface-variant text-sm uppercase tracking-wider">Blood Pressure</span>
<span class="font-headline-md text-headline-md text-on-background">120/80 <span class="text-sm font-normal text-on-surface-variant">mmHg</span></span>
</div>
<div class="bg-surface p-4 rounded-lg border border-outline-variant flex flex-col items-start gap-1">
<span class="font-body-md text-on-surface-variant text-sm uppercase tracking-wider">SpO2</span>
<span class="font-headline-md text-headline-md text-on-background">97 <span class="text-sm font-normal text-on-surface-variant">%</span></span>
</div>
<div class="bg-surface p-4 rounded-lg border border-outline-variant flex flex-col items-start gap-1">
<span class="font-body-md text-on-surface-variant text-sm uppercase tracking-wider">Temp</span>
<span class="font-headline-md text-headline-md text-on-background">36.8 <span class="text-sm font-normal text-on-surface-variant">°C</span></span>
</div>
</div>
<!-- Status Badge -->
<div class="bg-[#10B981] bg-opacity-10 border-2 border-[#10B981] text-[#047857] rounded-lg p-4 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-xl text-label-xl tracking-wide">TRIAGE STATUS: GREEN (STABLE)</span>
</div>
</div>
<!-- Instruction Text -->
<p class="font-body-lg text-body-lg text-on-surface-variant text-center px-4">
            Patient vitals are within normal clinical thresholds. Safe for home care or local follow-up.
        </p>
</main>
<!-- Bottom Action Area -->
<footer class="px-screen-margin pb-screen-margin flex flex-col gap-4 mt-auto">
<button class="w-full bg-primary-container text-on-primary font-action-lg text-action-lg py-button-padding-v px-button-padding-h rounded-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
            Sync Data to Cloud
        </button>
<button class="w-full bg-surface text-primary font-action-lg text-action-lg py-button-padding-v px-button-padding-h rounded-lg border-2 border-primary flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span>Finish &amp; Return to Home</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
</body></html>
